<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>翔平シート 作成</title><style>:root{--line:#c9d1d7}*{box-sizing:border-box}body{margin:0;background:#f4f7f9;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:760px;margin:auto;padding:16px 14px 110px}h1{font-size:23px}.sub{color:#64727d;font-size:13px}.card{background:#fff;border:1px solid #dde4e8;border-radius:16px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #cbd5dc;border-radius:10px;padding:11px 12px;font:inherit}.field textarea{min-height:88px}.outcomeField{border:2px solid #9cc7df;background:#f4fbff}.outcomeField label{font-size:16px}.actions{position:fixed;bottom:0;left:0;right:0;background:#fffffff0;border-top:1px solid #ddd;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;z-index:20}.actions button{border:0;border-radius:11px;padding:13px 16px;font-weight:800;font-size:15px}.save{background:#111;color:#fff}.preview{background:#e6edf2}.clear{background:#fff0f0;color:#a12b2b}.sheetWrap{display:none;overflow:auto;margin-top:18px}.sheet{width:1024px;height:1500px;background:#fff;border:1px solid #222;overflow:hidden;font-family:"Yu Gothic","Hiragino Sans",sans-serif}.title{height:98px;background:#dbeaf3;border-bottom:2px solid #222;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:900}.topbar{height:52px;background:#e4f2f8;border-bottom:2px solid #222;display:flex;align-items:center;font-size:27px;font-weight:800;padding:0 35px}.month{width:310px;text-align:center}.topgrid{height:612px;display:grid;grid-template-columns:39% 61%;border-bottom:2px solid #222}.left,.right{position:relative;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:68px 68px}.left{border-right:1px solid var(--line)}.boxtext{position:absolute;left:10px;right:10px;white-space:pre-wrap;font-size:21px;line-height:1.45;font-weight:650}.g{top:12px}.m{top:252px}.cause{top:415px}.right .boxtext{top:12px;left:18px}.sectionTitle{height:108px;background:#dbeaf3;border-bottom:2px solid #222;position:relative;font-weight:900}.goalArrow{position:absolute;left:210px;top:13px;font-size:34px}.goalLabel{position:absolute;left:280px;top:10px;font-size:31px}.goalOutcome{position:absolute;left:385px;right:18px;top:10px;height:58px;font-size:25px;line-height:1.12;white-space:pre-wrap;overflow:hidden;overflow-wrap:anywhere;word-break:break-word;font-weight:800}.goalMonth{position:absolute;left:125px;bottom:7px;font-size:31px;min-width:140px;text-align:center}.goalD{position:absolute;left:280px;bottom:8px;font-size:21px}.goals{height:470px;display:grid;grid-template-rows:1fr 1.35fr;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:68px 68px}.goal{padding:13px 12px;overflow:hidden}.goalTitle{font-size:28px;font-weight:900;line-height:1.15;margin-bottom:12px}.goalText{font-size:23px;line-height:1.35;font-weight:800;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal}.footer{height:160px;background:#e0eff6;padding:10px 20px 8px;display:grid;grid-template-columns:68% 32%;gap:0}.quote{font-weight:800;padding-right:20px;font-size:18px;line-height:1.45}.quoteHead{white-space:nowrap;margin-bottom:6px}.quotePoint{margin-left:145px;white-space:nowrap;margin-top:4px}.meta{background:#fff9;padding:10px 14px;font-weight:700;line-height:1.35;overflow:hidden}.metaRow{margin-bottom:5px}.nameRow{display:flex;align-items:baseline;gap:8px;margin-top:6px;white-space:nowrap}.nameLabel{font-size:28px;font-weight:900}.nameValue{font-size:24px;font-weight:900;overflow:hidden;text-overflow:ellipsis}.metaSmall{font-size:17px}@media(max-width:600px){.grid{grid-template-columns:1fr}.app{padding-left:12px;padding-right:12px}.sheetWrap{margin-left:-12px;margin-right:-12px}.actions button{font-size:13px;padding:12px 11px}}</style></head><body><div class="app"><h1>翔平シート 作成</h1><p class="sub">今月の振り返りと次月の目標を入力して画像保存できます。</p><div class="card"><div class="grid"><div class="field"><label>今月</label><input id="currentMonth" placeholder="例：9月"></div><div class="field"><label>次月</label><input id="nextMonth" placeholder="例：10月"></div><div class="field"><label>名前</label><input id="name"></div><div class="field"><label>担当者コード</label><input id="code"></div><div class="field"><label>部門</label><input id="dept"></div></div></div><div class="card"><div class="field"><label>G：現状</label><textarea id="current"></textarea></div><div class="field"><label>M：マイナス</label><textarea id="minus"></textarea></div><div class="field"><label>G：原因</label><textarea id="cause"></textarea></div><div class="field"><label>D：どうすれば</label><textarea id="how"></textarea></div><div class="field outcomeField"><label>D：どうなる</label><textarea id="outcome" placeholder="どうなるかを入力"></textarea></div></div><div class="card"><div class="field"><label>定量目標（数字）</label><textarea id="quant"></textarea></div><div class="field"><label>定性目標（行動）</label><textarea id="qual"></textarea></div></div><div class="sheetWrap" id="sheetWrap"><div class="sheet" id="sheet"><div class="title">大谷翔平シート　変化・挑戦・努力</div><div class="topbar"><div class="month" id="sMonth"></div><div>現状・マイナス・原因・どうすれば・どうなる</div></div><div class="topgrid"><div class="left"><div class="boxtext g" id="sCurrent"></div><div class="boxtext m" id="sMinus"></div><div class="boxtext cause" id="sCause"></div></div><div class="right"><div class="boxtext" id="sHow"></div></div></div><div class="sectionTitle"><span class="goalArrow">→</span><span class="goalLabel">目標：</span><span class="goalOutcome" id="sOutcome"></span><span class="goalMonth" id="sGoalMonth"></span><span class="goalD">D：どうなる</span></div><div class="goals"><div class="goal"><div class="goalTitle">定量目標（数字）</div><div class="goalText" id="sQuant"></div></div><div class="goal"><div class="goalTitle">定性目標（行動）</div><div class="goalText" id="sQual"></div></div></div><div class="footer"><div class="quote"><div class="quoteHead">ノジマウェイ(1)より「イチロー」より　成功の秘訣</div><div class="quotePoint">①高い目標を掲げたこと</div><div class="quotePoint">②目標達成に向けて工夫と努力を重ねたこと</div></div><div class="meta"><div class="metaRow metaSmall">担当者コード：<span id="sCode"></span></div><div class="metaRow metaSmall">部門：<span id="sDept"></span></div><div class="nameRow"><span class="nameLabel">名前：</span><span class="nameValue" id="sName"></span></div></div></div></div></div></div><div class="actions"><button class="clear" id="clear">クリア</button><button class="preview" id="preview">画像プレビュー</button><button class="save" id="save">画像保存</button></div><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script>const ids=['currentMonth','nextMonth','name','code','dept','current','minus','cause','how','outcome','quant','qual'];const $=id=>document.getElementById(id),KEY='shohei-sheet-v3';function load(){try{let d=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('shohei-sheet-v2')||'{}');ids.forEach(id=>$(id).value=d[id]||'')}catch(e){}}function persist(){let d={};ids.forEach(id=>d[id]=$(id).value);localStorage.setItem(KEY,JSON.stringify(d))}function fitOutcome(){let el=$('sOutcome'),n=el.textContent.length,size=n<=22?25:n<=38?21:n<=55?18:n<=75?15:13;el.style.fontSize=size+'px';el.style.lineHeight=n>55?'1.06':'1.12'}function fitGoal(id,maxH){let el=$(id),size=23;el.style.fontSize=size+'px';el.style.lineHeight='1.35';while(el.scrollHeight>maxH&&size>15){size--;el.style.fontSize=size+'px';el.style.lineHeight=size<19?'1.22':'1.3'}}function render(show=true){let v=id=>$(id).value.trim();$('sMonth').textContent=(v('currentMonth')||'　月')+' →';$('sGoalMonth').textContent=v('nextMonth')||'　月';$('sCurrent').textContent='G：現状\n'+v('current');$('sMinus').textContent='M：マイナス\n'+v('minus');$('sCause').textContent='G：原因\n'+v('cause');$('sHow').textContent='D：どうすれば\n'+v('how');$('sOutcome').textContent=v('outcome');fitOutcome();$('sQuant').textContent=v('quant');$('sQual').textContent=v('qual');$('sCode').textContent=v('code');$('sDept').textContent=v('dept');$('sName').textContent=v('name');if(show)$('sheetWrap').style.display='block';requestAnimationFrame(()=>{fitGoal('sQuant',150);fitGoal('sQual',220)})}ids.forEach(id=>$(id).addEventListener('input',()=>{persist();render(false)}));load();render(false);$('preview').onclick=()=>{render(true);$('sheetWrap').scrollIntoView({behavior:'smooth'})};$('save').onclick=async()=>{render(true);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));let b=$('save');b.disabled=true;b.textContent='作成中…';try{let c=await html2canvas($('sheet'),{scale:2,backgroundColor:'#fff',useCORS:true});let blob=await new Promise(r=>c.toBlob(r,'image/png'));let filename='翔平シート_'+($('currentMonth').value||'今月')+'-'+($('nextMonth').value||'次月')+'.png';let file=new File([blob],filename,{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'翔平シート'});}else{let a=document.createElement('a');a.download=filename;a.href=URL.createObjectURL(blob);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}}catch(e){if(e&&e.name!=='AbortError')alert('共有画面を開けませんでした。もう一度お試しください。')}finally{b.disabled=false;b.textContent='画像保存'}};$('clear').onclick=()=>{if(confirm('入力内容をすべて消しますか？')){ids.forEach(id=>$(id).value='');persist();render(false)}};</script></body></html>
